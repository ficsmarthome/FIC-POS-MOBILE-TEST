name: fic_pos_mobile
description: FIC POS Mobile client for Android and iOS
publish_to: 'none'
version: 1.14.0+93
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.4.1
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  wakelock_plus: ^1.3.2
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
  sqflite: ^2.4.2
  path: ^1.9.1
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/fic_logo.png

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/fic_logo.png"
  remove_alpha_ios: true
