org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter currently expects the classic android { } DSL when discovering applicationId/launch activity.
# AGP 9 defaults to the new DSL where that accessor becomes a compile-time deprecation error.
android.newDsl=false
