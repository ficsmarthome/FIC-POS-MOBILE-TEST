workflows:
  fic-pos-ios-ipa-only:
    name: FIC POS TEST iOS IPA Only
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter packages
        script: |
          flutter pub get

      - name: Prepare iOS project
        script: |
          chmod +x tool/prepare_ios.sh
          ./tool/prepare_ios.sh

      - name: Install CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;

      - name: Build iOS without signing
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -e
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry FIC-POS-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/FIC-POS-unsigned.ipa
