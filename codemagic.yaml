workflows:
  fic-pos-ios-preview:
    name: FIC POS TEST iOS Preview
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: |
          flutter pub get

      - name: Prepare iOS project
        script: |
          chmod +x tool/prepare_ios.sh
          ./tool/prepare_ios.sh

      - name: Build iOS without signing
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app/**

  fic-pos-ios-simulator:
    name: FIC POS TEST iOS Simulator Preview
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: |
          flutter pub get

      - name: Prepare iOS project
        script: |
          chmod +x tool/prepare_ios.sh
          ./tool/prepare_ios.sh

      - name: Build iOS Simulator
        script: |
          flutter build ios --simulator

    artifacts:
      - build/ios/iphonesimulator/Runner.app/**
